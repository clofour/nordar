---

- name: Create service private key
  community.crypto.openssl_privatekey:
    path: "{{ pki_runtime_private_dir }}/{{ service_cert.name }}.key"
    type: RSA
    size: 2048
    return_content: true
    owner: root
    group: "{{ service_cert.group }}"
    mode: "0640"
  register: pki_runtime_private_key
  no_log: true

- name: Create service CSR
  community.crypto.openssl_csr_pipe:
    privatekey_path: "{{ pki_runtime_private_dir }}/{{ service_cert.name }}.key"
    common_name: "{{ service_cert.common_name }}"
    subject_alt_name: "{{ service_cert.sans }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage: "{{ service_cert.extended_key_usage }}"
    basic_constraints:
      - "CA:FALSE"
    basic_constraints_critical: true
  register: pki_runtime_csr

- name: Get existing certificate contents
  ansible.builtin.slurp:
    src: "{{ pki_runtime_public_dir }}/{{ service_cert.name }}.crt"
  register: pki_runtime_service_crt_content
  failed_when: false

- name: Sign service certificate with Ansible CA
  community.crypto.x509_certificate_pipe:
    content: >-
      {{
        (pki_runtime_service_crt_content.content | b64decode)
        if (pki_runtime_service_crt_content is defined and pki_runtime_service_crt_content.content is defined and not (pki_runtime_service_crt_content.content.failed | default(true)))
        else omit
      }}
    csr_content: "{{ pki_runtime_csr.csr }}"
    provider: ownca
    ownca_path: "{{ pki_source_dir }}/{{ pki_runtime_ansible_crt_name }}.crt"
    ownca_privatekey_path: "{{ pki_source_dir }}/{{ pki_runtime_ansible_crt_name }}.key"
    ownca_not_before: "-1d"
    ownca_not_after: "+365d"
  delegate_to: localhost
  register: pki_runtime_signed_service_crt
  no_log: true

- name: Install service certificate
  ansible.builtin.copy:
    content: "{{ pki_runtime_signed_service_crt.certificate }}"
    dest: "{{ pki_runtime_public_dir }}/{{ service_cert.name }}.crt"
    owner: root
    group: root
    mode: "0644"

- name: Read installed PKI
  ansible.builtin.slurp:
    src: "{{ item }}"
  loop:
    - "{{ pki_runtime_public_dir }}/{{ service_cert.name }}.crt"
    - "{{ pki_runtime_target_dir }}/{{ pki_runtime_ansible_crt_name }}.crt"
    - "{{ pki_runtime_private_dir }}/{{ service_cert.name }}.key"
  register: pki_runtime_material
  no_log: true

- name: Create merged service PEM
  ansible.builtin.copy:
    content: |
      {{ pki_runtime_material.results[0].content | b64decode | trim }}
      {{ pki_runtime_material.results[1].content | b64decode | trim }}
      {{ pki_runtime_material.results[2].content | b64decode | trim }}
    dest: "{{ pki_runtime_private_dir }}/{{ service_cert.name }}.pem"
    owner: root
    group: "{{ service_cert.group }}"
    mode: "0640"
  no_log: true

- name: Install service fullchain certificate
  ansible.builtin.copy:
    content: |
      {{ pki_runtime_material.results[0].content | b64decode | trim }}
      {{ pki_runtime_material.results[1].content | b64decode | trim }}
    dest: "{{ pki_runtime_public_dir }}/{{ service_cert.name }}-{{ pki_runtime_chain_crt_name }}.crt"
    owner: root
    group: root
    mode: "0644"
