---

- name: Disable automatic PostgreSQL cluster creation
  ansible.builtin.copy:
    content: |
      create_main_cluster: false
    dest: /etc/postgresql-common/createcluster.conf
    owner: root
    group: root
    mode: "0644"

- name: Set up PGDG repository and key
  ansible.builtin.deb822_repository:
    name: postgresql
    types: deb
    uris: https://apt.postgresql.org/pub/repos/apt
    suites: "{{ ansible_distribution_release }}-pgdg"
    components: main
    architectures: "{{ pre_dpkg_arch.stdout }}"
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Update repositories
  ansible.builtin.apt:
    update_cache: true

- name: Install PostgreSQL
  ansible.builtin.apt:
    name: postgresql-{{ postgresql_version }}
    state: present

- name: Disable PostgreSQL service
  ansible.builtin.service:
    name: postgresql
    state: stopped
    enabled: false
