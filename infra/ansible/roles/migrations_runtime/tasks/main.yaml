---

- name: Copy migrations bundle
  ansible.builtin.copy:
    src: "{{ migrations_runtime_source_dir }}"
    dest: "{{ migrations_runtime_target_dir }}"
    owner: root
    group: root
    mode: "0755"
  run_once: true
  delegate_to: "{{ groups['backend'][0] }}"

- name: Run migrations
  ansible.builtin.command: "{{ migrations_runtime_target_dir }} --connection={{ db_connection_string }}"
  run_once: true
  delegate_to: "{{ groups['backend'][0] }}"
  no_log: true
  changed_when: false

