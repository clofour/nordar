---

- name: Configure etcd
  ansible.builtin.template:
    src: templates/config.yaml.j2
    dest: /etc/etcd/config.yaml
    owner: root
    group: etcd
    mode: "0640"
  notify: Restart etcd

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable and start etcd service
  ansible.builtin.service:
    name: etcd
    state: started
    enabled: true
